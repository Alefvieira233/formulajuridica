<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fórmula Jurídica — Acelere a captação de clientes do seu escritório</title>
    <meta
      name="description"
      content="A assessoria que constrói o posicionamento digital e os canais de aquisição comercial do seu escritório de advocacia. Mais de 500 contratos fechados em 2025. Receba um diagnóstico gratuito."
    />
    <meta property="og:title" content="Fórmula Jurídica — marketing de alta performance para advogados" />
    <meta
      property="og:description"
      content="Posicionamento digital + tráfego + direcionamento comercial. Preencha o formulário e receba o contato do nosso time."
    />
    <meta property="og:type" content="website" />
    <!-- [AJUSTAR] troque pela URL absoluta do domínio final (ex.: https://formulajuridica.com.br/og.jpg) -->
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Fórmula Jurídica",
        "alternateName": "BKS 360",
        "description": "Programa de aceleração para escritórios de advocacia: posicionamento digital, geração de demanda e direcionamento comercial. Mais de 200 escritórios atendidos no Brasil.",
        "founder": { "@type": "Person", "name": "Higor Vieira" },
        "areaServed": "BR"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Como funciona o diagnóstico gratuito?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Você preenche o formulário com as informações do seu escritório. Nosso time analisa o cenário e entra em contato em horário comercial para apresentar uma leitura inicial e os próximos passos."
            }
          },
          {
            "@type": "Question",
            "name": "Quanto custa o serviço?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "O investimento depende do momento e da estrutura de cada escritório, e é apresentado na conversa com nosso especialista, depois do diagnóstico."
            }
          },
          {
            "@type": "Question",
            "name": "O marketing segue as normas da OAB?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim. Toda a estratégia é construída dentro do Provimento 205/2021, que regulamenta o marketing jurídico."
            }
          }
        ]
      }
    </script>
    <link
      rel="preload"
      href="/fonts/anton-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      META PIXEL: cole aqui o snippet oficial do Pixel (Eventos: PageView aqui,
      Lead é disparado automaticamente pelo formulário via window.fbq).
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
